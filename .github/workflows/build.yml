name: Build TI-84 CE Program

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CE Toolchain
        run: |
          wget https://github.com/CE-Programming/toolchain/releases/download/v12.0/CEdev-Linux.tar.gz
          tar -xzf CEdev-Linux.tar.gz
          echo "$GITHUB_WORKSPACE/CEdev/bin" >> $GITHUB_PATH
          echo "CEDEV=$GITHUB_WORKSPACE/CEdev" >> $GITHUB_ENV

      - name: Compile Program
        run: make

      - name: Upload .8xp File
        uses: actions/upload-artifact@v4
        with:
          name: VIDPLAYER-8xp
          path: bin/VIDPLAYER.8xp
